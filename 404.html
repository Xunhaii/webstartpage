<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 页面走丢了 | Xunhaii起始页</title>
    <meta name="description" content="404 - 您访问的页面不存在">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" type="image/x-icon" href="https://static.xunhaii.com/favicon.ico">
    <meta name="author" content="Xunhaii">
    <meta name="theme-color" id="theme-color" content="#f5f7fa">
    <link rel="stylesheet" href="https://static.xunhaii.com/lib/font-awesome-v7/css/all.min.css">
    <link rel="stylesheet" href="/css/404.css">
    <script>
        // 首帧同步应用背景效果（必须在 CSS 加载前执行以避免模糊闪烁）
        (function () {
            try {
                var raw = localStorage.getItem('bgConfig');
                if (!raw) return;
                var cfg = JSON.parse(raw) || {};
                var e = cfg.effects || {};
                var root = document.documentElement;
                if (typeof e.blur === 'number') root.style.setProperty('--bg-blur', e.blur + 'px');
                if (typeof e.brightness === 'number') root.style.setProperty('--bg-brightness', e.brightness + '%');
                if (typeof e.saturation === 'number') root.style.setProperty('--bg-saturation', e.saturation + '%');
                if (typeof e.overlay === 'number') root.style.setProperty('--bg-overlay', (e.overlay / 100).toString());
                if (cfg.type === 'url' && cfg.value) {
                    var url = String(cfg.value)
                        .replace(/\\/g, '\\\\')
                        .replace(/"/g, '\\"')
                        .replace(/\n/g, '\\n')
                        .replace(/\r/g, '\\r');
                    root.style.setProperty('--bg-image', 'url("' + url + '")');
                }
            } catch (err) { /* 忽略 */ }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header>
            <a class="logo" href="/">
                <i class="fas fa-compass"></i>
                <span>Xunhaii起始页</span>
            </a>
            <div class="header-controls">
                <button class="theme-btn" id="theme-toggle" aria-label="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <main class="error-main">
            <div class="error-glow">
                <i class="fas fa-compass error-icon" aria-hidden="true"></i>
                <div class="error-code" aria-hidden="true">404</div>
            </div>

            <h1 class="error-title">这个页面走丢了</h1>

            <p class="error-desc">
                你要找的页面可能已被删除、更名，或从未存在过。<br>
                检查一下地址是否正确，或者回到首页继续逛逛吧。
                <span class="error-path" id="error-path"></span>
            </p>

            <div class="error-actions">
                <a class="btn btn-primary" href="/">
                    <i class="fas fa-home"></i>
                    <span>返回首页</span>
                </a>
                <button class="btn btn-outline" id="go-back" type="button">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回上一页</span>
                </button>
            </div>

            <div class="error-footer-tip">
                <i class="fas fa-lightbulb"></i>
                <span>想找点别的？回首页试试搜索框吧</span>
            </div>
        </main>

        <div class="footer">
            © 2026 Xunhaii. | All rights reserved.
            <br>
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">
                黔ICP备2026000583号-1
            </a>|
            <a href="https://beian.mps.gov.cn/#/query/webSearch?code=52052202522626" rel="noreferrer" target="_blank">
                <img alt="公安备案图标" src="https://static.xunhaii.com/images/beian_ga.png">
                贵公网安备52052202522626号
            </a>
        </div>
    </div>

    <script src="/js/404.js"></script>
</body>
</html>
